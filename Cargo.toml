[package]
name = "quarttet-core"
version = "0.1.0"
edition = "2024"
description = "4D tetrahedral meshes, TE4 parsing and hyperplane sections"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
